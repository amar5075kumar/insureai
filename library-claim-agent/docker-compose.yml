services:

  # ─── Infrastructure (all built from cached base images, no pull needed) ─────

  postgres:
    build:
      context: ./services/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-library_claim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claim_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    build:
      context: ./services/redis
      dockerfile: Dockerfile
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    build:
      context: ./services/livekit
      dockerfile: Dockerfile
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    depends_on:
      redis:
        condition: service_healthy

  # ─── Application Services ──────────────────────────────────────────────────

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      FRAMES_STORAGE: filesystem
      FRAMES_DIR: /app/frame_data
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SWEEP_PROFILE: slow
      PYTHONPATH: /app:/repo_root
    volumes:
      - ./models:/app/models:ro
      - ./output:/repo_root/output:ro
      - ./config:/repo_root/config:ro
      - frame_data:/app/frame_data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  agents:
    build:
      context: ./services/agents
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      # LLM Provider — set LLM_PROVIDER to: bedrock | anthropic | openai
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_BASE_URL: ${BEDROCK_BASE_URL:-}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-}
      BEDROCK_AUTH_TYPE: ${BEDROCK_AUTH_TYPE:-aws}
      SWEEP_PROFILE: slow
      FRAMES_DIR: /app/frame_data
      PYTHONPATH: /app:/repo_root
    volumes:
      - ./output:/repo_root/output:ro
      - ./config:/repo_root/config:ro
      - frame_data:/app/frame_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  worker-book-id:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q book_id -c 5 --loglevel=info -n book-id@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      FRAMES_STORAGE: filesystem
      FRAMES_DIR: /app/frame_data
      SWEEP_PROFILE: slow
      PYTHONPATH: /app:/repo_root
    volumes:
      - ./models:/app/models:ro
      - ./output:/repo_root/output:ro
      - ./config:/repo_root/config:ro
      - frame_data:/app/frame_data:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-pricing:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q pricing -c 5 --loglevel=info -n pricing@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      SWEEP_PROFILE: slow
      PYTHONPATH: /app:/repo_root
    volumes:
      - ./config:/repo_root/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-measurement:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q measurement -c 2 --loglevel=info -n measurement@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      FRAMES_STORAGE: filesystem
      FRAMES_DIR: /app/frame_data
      SWEEP_PROFILE: slow
      PYTHONPATH: /app:/repo_root
    volumes:
      - ./models:/app/models:ro
      - ./config:/repo_root/config:ro
      - frame_data:/app/frame_data:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-lite:
    build:
      context: ./services/worker-lite
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      FRAMES_DIR: /app/frame_data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PYTHONPATH: /app
    volumes:
      - frame_data:/app/frame_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vision:
    build:
      context: ./services/vision
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-library_claim}
      REDIS_URL: redis://redis:6379/0
      FRAMES_STORAGE: filesystem
      FRAMES_DIR: /app/frame_data
      SWEEP_PROFILE: ${SWEEP_PROFILE:-slow}
      PYTHONPATH: /app:/repo_root
    volumes:
      - ./config:/repo_root/config:ro
      - frame_data:/app/frame_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      # Camera mode:
      #   direct  = getUserMedia + HTTP frames (default, works in WSL2/local)
      #   livekit = WebRTC via LiveKit (use in cloud/production)
      VITE_CAMERA_MODE: ${CAMERA_MODE:-direct}
      VITE_LIVEKIT_URL: ws://localhost:7880
      VITE_FRAME_INTERVAL_MS: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frame_data:
